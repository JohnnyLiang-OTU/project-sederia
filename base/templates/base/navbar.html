{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'fontawesomefree/css/fontawesome.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'fontawesomefree/css/brands.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static 'fontawesomefree/css/solid.css' %}" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
</head>
<body class="bg-white">

<div class="container my-3">
    <!-- Top Navbar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center">
            <a class="title-link" href="{% url 'home' %}"><h1 class="mb-0" style="font-family: serif; font-size: 3rem; font-weight: bold;">Gera Enterprises S.A</h1></a>
        </div>
        <!-- <input type="text" class="form-control border border-dark" placeholder="SEARCH" style="max-width: 300px;"> -->
        <div class="d-flex align-items-center">
        </div>
    </div>

    <!-- Category Filters -->
     {% for category in category_query %}
     <div class="d-flex flex-wrap gap-2 mb-3"></div>
     <button class="btn btn-outline-dark px-3">{{category.name}}</button>
     {% endfor %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
